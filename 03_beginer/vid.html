<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and video Player</title>
</head>
<body>
    <header>
        <h1>
            Audio and Video player
        </h1>
    </header>

    <main>
        <h1>
            <video src="video.mp4" controls width="480"></video>
            <video src="video2.mp4" controls width="480"></video>
            <video src="video3.mp4" controls width="480"></video>
        </h1>

        <h1>
            <audio src="audio.mp3" controls></audio>
            <audio src="audio2.mp3" controls></audio>
            <audio src="audio3.mp3" controls></audio>
            <div>
                <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/1Es7AUAhQvapIcoh3qMKDL?utm_source=generator" width="25%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>
            <input type="password" name="password" placeholder="Enter your password">
    </main>

    <footer>
        All Rights Reserved
    </footer>
</body>
</html>
