<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        body{
            background-color: grey;
        }
        div{
            position: relative;
            left: 600px;
            top: 50px;
        }
        .frame {
            border: 2px solid black;
            height: 450px;
            width: 300px;
            border-radius: 20px;
            background-color: white;
        }

        img {
            border-radius: 15px;
            position: relative;
            left: 9px;
            top: 9px;
            border: 2px solid black;
        }
        .pils{
            position: relative;
            top: 20px;
            left: 10px;
            padding: 5px;
            border-radius: 10px;
            border: 2px solid black;
        }h1{
            font-size: 20px;
            position: relative;
            top: 20px;
            left: 10px;
        }
        p{
            position: relative;
            padding: 10px;
        }
        .read{
            padding: 7px;
            border: 2px solid #afd3f9;
            border-radius: 20px;
            color: #2289fe;
            background-color: #afd3f9;
            position: relative;
            text-align: center;
            left: 100px;
            bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="frame">
        <img class="image" width="280" src="teen-titans-go-robin-beast.webp" alt="image">
        <span class="pils pil1">Nature</span>
        <span class="pils pil2">Lake</span>
        <h1>Lorem, ipsum dolor</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Asperiores laborum, ullam vero labore sed eligendi minima hic numquam vel necessitatibus at assumenda fuga ipsa debitis voluptas animi fugit blanditiis. Dolor, inventore? Eum quis alias maiores?</p>
        <span class="read">Read More</span>
    </div>
</body>

</html>
